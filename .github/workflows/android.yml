name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: ./gradlew :app:android:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Display APK SHA256
        run: |
          echo "### APK SHA256" >> "$GITHUB_STEP_SUMMARY"
          sha256sum app/android/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
